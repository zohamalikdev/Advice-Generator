<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Advice Capsule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="advice-card">
        <div class="capsule-tag">Advice #<span id="advice-id">00</span></div>
        
        <p id="advice-text" class="fade-in">"Click the button below to get a little spark of wisdom."</p>
        
        <div class="divider">✦ ✦ ✦</div>

        <div class="action-row">
            <button id="copy-btn" class="icon-btn" title="Copy to clipboard">📋</button>
            <button id="next-btn" class="main-btn">Give me advice </button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
